<style>

  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;

  a{color:var(--accent-d)}
  .wrap{max-width:1000px;margin:0 auto;padding:0 24px}

  /* Sélecteur de langue */
  .langsw{position:absolute;top:16px;right:16px;display:flex;gap:4px;font-family:var(--mono);z-index:5}
  .langsw button{font-family:var(--mono);font-size:.74rem;font-weight:500;color:var(--accent-d);
    background:var(--card);border:1px solid var(--border);border-radius:999px;padding:5px 12px;cursor:pointer;
    transition:all .15s}
  .langsw button:hover{border-color:var(--accent)}
  .langsw button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* Bannière */
  .band{position:relative;background:var(--band);border-bottom:1px solid var(--border)}
  .band .wrap{padding:56px 24px 48px;text-align:center;display:flex;flex-direction:column;align-items:center}
  .avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;border:3px solid var(--card);

  .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;
    color:var(--accent-d);margin:0 0 12px}
  .band h1{font-family:var(--serif);font-weight:700;color:var(--ink);font-size:2.9rem;margin:0 0 10px;
    line-height:1.02;letter-spacing:-.01em;text-wrap:balance}
  .band .lead{color:var(--text);font-size:1.05rem;margin:0;max-width:600px}
  .contact{margin-top:20px;display:flex;gap:10px 20px;justify-content:center;flex-wrap:wrap;
    font-family:var(--mono);font-size:.8rem}
  .contact a{color:var(--accent-d);text-decoration:none}
  .contact a:hover{text-decoration:underline}

  /* Sections */
  section{padding:48px 0}
  h2{font-family:var(--serif);font-weight:700;color:var(--ink);font-size:1.7rem;text-align:center;margin:0}
  .section-intro{text-align:center;color:var(--muted);margin:6px 0 0;font-size:.95rem}

  /* Filtres */

  .filter{font-family:var(--mono);font-size:.76rem;color:var(--accent-d);background:var(--card);

  .filter:hover{border-color:var(--accent)}
  .filter[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* Grille */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;margin-top:26px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;
    display:flex;flex-direction:column;transition:transform .18s ease,box-shadow .18s ease}
  .card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(46,108,98,.12)}
  .card .thumb{width:100%;height:auto;display:block;background:var(--line);
    border-bottom:1px solid var(--border)}
  .card .pad{padding:20px 22px 22px;display:flex;flex-direction:column;flex:1}
  .card .year{font-family:var(--mono);color:var(--accent);font-size:.74rem;font-weight:500}
  .card h3{font-family:var(--serif);font-size:1.24rem;color:var(--ink);margin:4px 0 0;line-height:1.2}
  .award{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;margin-top:10px;
    font-family:var(--mono);font-size:.7rem;font-weight:500;color:var(--gold);background:var(--gold-soft);
    border-radius:999px;padding:3px 10px}
  .card p.desc{color:var(--text);font-size:.92rem;margin:12px 0 0;flex:1}
  .tech{margin-top:16px;display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-family:var(--mono);font-size:.68rem;color:var(--accent-d);background:var(--accent-soft);
    border-radius:5px;padding:2px 8px}
  .cta{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
  .lnk{font-family:var(--mono);display:inline-block;padding:8px 16px;border-radius:8px;font-size:.78rem;

  .lnk.primary{background:var(--accent);color:#fff}
  .lnk.primary:hover{background:var(--accent-d)}
  .lnk.ghost{background:transparent;color:var(--accent-d);border:1.5px solid var(--accent)}
  .lnk.ghost:hover{background:var(--band)}

  /* À propos */
  .about{background:var(--band);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  .about p{max-width:680px;margin:20px auto 0;text-align:center;color:var(--text);font-size:1.02rem}

  footer{padding:30px 0 48px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:.8rem}
  footer a{color:var(--accent-d);text-decoration:none}
  footer a:hover{text-decoration:underline}
  @media(max-width:560px){ .band h1{font-size:2.2rem} }
</style>

function buttons(links, lang){
  return (links||[]).map(l=>{
    const cls = (l.type==="download") ? "primary" : "ghost";
    const label = (LINK_LABELS[lang] && LINK_LABELS[lang][l.label]) || l.label;
    return `<a class="lnk ${cls}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(label)}</a>`;
  }).join("");
}

function cardHTML(p, lang){
  const v = (lang==="en" && p.en) ? Object.assign({}, p, p.en) : p;
  return `<article class="card" data-cats="${esc((p.cats||[]).join(' '))}">
    ${p.image ? `<img class="thumb" src="${esc(p.image)}" alt="${esc(v.title)}" loading="lazy">` : ""}
    <div class="pad">
      <div class="year">${esc(v.year)}</div>
      <h3>${esc(v.title)}</h3>
      ${v.award ? `<div class="award">★ ${esc(v.award)}</div>` : ""}
      <p class="desc">${esc(v.desc)}</p>
      <div class="tech">${v.tech.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>
      ${(p.links&&p.links.length)?`<div class="cta">${buttons(p.links, lang)}</div>`:""}
    </div>
  </article>`;
}

const grid = document.getElementById("grid");
const filters = document.getElementById("filters");
const CAT_KEYS = Array.from(new Set(PROJECTS.flatMap(p=>p.cats||[])));
let activeCat = "Tous"; // clé canonique interne

function renderFilters(lang){
  const t = T[lang];
  const items = [["Tous", t.all], ...CAT_KEYS.map(c=>[c, CAT_LABELS[lang][c]||c])];
  filters.innerHTML = items.map(([key,label])=>
    `<button class="filter" data-cat="${esc(key)}" aria-pressed="${key===activeCat}">${esc(label)}</button>`
  ).join("");
}

function applyFilter(){
  grid.querySelectorAll(".card").forEach(card=>{
    const cats = card.dataset.cats.split(" ");
    card.hidden = !(activeCat==="Tous" || cats.includes(activeCat));
  });
}

function apply(lang){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  document.getElementById("lead").textContent = t.lead;
  document.getElementById("projectsTitle").textContent = t.projectsTitle;
  document.getElementById("intro").textContent = `${PROJECTS.length} ${t.introSuffix}`;
  document.getElementById("aboutTitle").textContent = t.aboutTitle;
  document.getElementById("aboutText").textContent = t.aboutText;
  grid.innerHTML = PROJECTS.map(p=>cardHTML(p, lang)).join("");
  renderFilters(lang);
  applyFilter();
  document.querySelectorAll("#langsw button").forEach(b=>
    b.setAttribute("aria-pressed", b.dataset.lang===lang));
  try{ localStorage.setItem("portfolio-lang", lang); }catch(e){}
}

document.getElementById("year").textContent = new Date().getFullYear();

filters.addEventListener("click", e=>{
  const btn = e.target.closest(".filter");
  if(!btn) return;
  activeCat = btn.dataset.cat;
  filters.querySelectorAll(".filter").forEach(b=>b.setAttribute("aria-pressed", b===btn));
  applyFilter();
});

document.getElementById("langsw").addEventListener("click", e=>{
  const btn = e.target.closest("button");
  if(!btn) return;
  apply(btn.dataset.lang);
});

let startLang = "fr";
try{ if(localStorage.getItem("portfolio-lang")==="en") startLang = "en"; }catch(e){}
apply(startLang);
</script>
</body>
</html>
